<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="1400" height="86" fill="#1A365D"/>
<text x="30.0" y="44.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start">Circuit Breaker States</text>
<text x="30.0" y="70.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#BEE3F8" text-anchor="start">Stop calling a failing dependency, then probe carefully before trusting it again</text>
<rect x="80" y="150" width="320" height="150" rx="14" fill="#E6F6EC" stroke="#2F855A" stroke-width="2.5"/>
<text x="240.0" y="188.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#1C4532" text-anchor="middle">CLOSED</text>
<text x="240.0" y="222.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Requests flow normally</text>
<text x="240.0" y="244.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Failures are counted</text>
<rect x="540" y="150" width="320" height="150" rx="14" fill="#FDECEC" stroke="#C53030" stroke-width="2.5"/>
<text x="700.0" y="188.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#63171B" text-anchor="middle">OPEN</text>
<text x="700.0" y="222.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Calls fail fast</text>
<text x="700.0" y="244.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Fallback is returned</text>
<text x="700.0" y="266.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Wait (e.g. 30 s)</text>
