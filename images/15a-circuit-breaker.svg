<line x1="998.0" y1="260.0" x2="862.0" y2="260.0" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/>
<text x="929.0" y="280.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#C53030" text-anchor="middle">trial fails</text>
<path d="M1160,300 C1160,410 240,410 240,304" fill="none" stroke="#2F855A" stroke-width="2" marker-end="url(#ah)"/>
<text x="700.0" y="398.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="bold" fill="#2F855A" text-anchor="middle">trial calls succeed → reset counters</text>
<text x="30.0" y="446.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#2D3748" text-anchor="start">Combine with timeouts, limited retries (idempotent calls only), bulkheads and fallbacks. Example: Resilience4j in Spring Boot.</text></svg>