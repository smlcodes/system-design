<text x="1160.0" y="188.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#652B19" text-anchor="middle">HALF-OPEN</text>
<text x="1160.0" y="222.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Allow a few trial calls</text>
<text x="1160.0" y="244.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="15" font-weight="normal" fill="#2D3748" text-anchor="middle">Decide next state</text>
<line x1="400.0" y1="200.0" x2="538.0" y2="200.0" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/>
<text x="469.0" y="190.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13" font-weight="bold" fill="#C53030" text-anchor="middle">failures &gt; threshold</text>
<line x1="860.0" y1="200.0" x2="998.0" y2="200.0" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/>
