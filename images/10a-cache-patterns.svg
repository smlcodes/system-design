<text x="30.0" y="450.0" font-family="'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" font-weight="normal" fill="#2D3748" text-anchor="start">Default choice: cache-aside for read-heavy data. Write-through when reads must be fresh. Write-back for counters/analytics where small loss is acceptable.</text></svg>